# Tesla BLE bridge on an M5Stack NanoC6 (ESP32-C6), using yoziru/esphome-tesla-ble.
# Reads the car's charging state/amps/kW over Bluetooth and exposes it on the LAN via
# ESPHome's web server (REST + /events SSE), which Solar Surplus EV subscribes to.
#
# First flash over USB:   .venv-esphome/Scripts/esphome run esphome/tesla-ble.yaml --device COM3
# Later updates over Wi-Fi: same command without --device.
# Secrets: copy secrets.yaml.example to secrets.yaml and fill it in.

substitutions:
  tesla_ble_ref: v2026.10.2
  tesla_vin: !secret tesla_vin
  tesla_vin_2: !secret tesla_vin_2
  # No MAC settings: the bridge finds each car's Bluetooth address from its VIN (see esp32_ble_tracker below).
  ble_mac_address: "00:00:00:00:00:00"
  ble_mac_address_2: "00:00:00:00:00:00"

esphome:
  name: tesla-ble
  friendly_name: Tesla BLE
  includes:
    - tesla_discover.h
  on_boot:
    then:
      - lambda: |-
          discover::init("${tesla_vin}", "${tesla_vin_2}");
          // Use the MAC found on an earlier boot for the active car (0 until it has been seen once).
          const uint64_t addr = id(active_car).current_option() == "Car 2" ? id(mac_car2) : id(mac_car1);
          if (addr) id(ble_tesla_id)->set_address(addr);

packages:
  tesla: github://yoziru/esphome-tesla-ble/tesla-ble-m5stack-nanoc6.dashboard.yml@v2026.10.2
  # To find a car's Bluetooth MAC (logged as "Found Tesla vehicle"), temporarily add:
  # listener: github://yoziru/esphome-tesla-ble/packages/listener.yml@v2026.10.2

# Pair as a charging-only key. The package default (DRIVER) can also unlock the car, open the
# trunk/frunk and windows; CHARGING_MANAGER can only start/stop charging, set amps and the charge
# limit, and open the charge port. The car enforces this. Changing it needs a re-pair (README).
tesla_ble_vehicle:
  role: CHARGING_MANAGER

# Bluetooth MACs found from the VINs, kept across reboots.
globals:
  - {id: mac_car1, type: uint64_t, restore_value: true, initial_value: "0"}
  - {id: mac_car2, type: uint64_t, restore_value: true, initial_value: "0"}

# Every advertisement: a Tesla's name is derived from its VIN, so the first time a configured car is heard
# its MAC is stored and, if it is the active car, used right away.
esp32_ble_tracker:
  on_ble_advertise:
    - lambda: |-
        for (int i = 0; i < 2; i++) {
          if (discover::name[i].empty() || x.get_name() != discover::name[i]) continue;
          const uint64_t addr = x.address_uint64();
          uint64_t &saved = i ? id(mac_car2) : id(mac_car1);
          if (saved == addr) return;
          saved = addr;
          ESP_LOGI("car", "Found Car %d: %s", i + 1, discover::mac_str(addr).c_str());
          if ((id(active_car).current_option() == "Car 2") == (i == 1)) {
            id(ble_tesla_id)->set_address(addr);
            id(ble_tesla_id)->disconnect();
          }
        }

text_sensor:
  - platform: template
    name: "Car 1 Address"
    entity_category: diagnostic
    lambda: 'return id(mac_car1) ? discover::mac_str(id(mac_car1)) : std::string("searching");'
    update_interval: 5s
  - platform: template
    name: "Car 2 Address"
    entity_category: diagnostic
    lambda: 'return id(mac_car2) ? discover::mac_str(id(mac_car2)) : std::string("searching");'
    update_interval: 5s

# Two cars, one bridge: "Active Car" swaps the VIN and Bluetooth address and reconnects. The same key
# is paired with each car (select the car, then Pair BLE Key in it). Solar Surplus EV switches cars on
# its own: it alternates while neither charge port is open and stays on a car while it's plugged in.
# Leave tesla_vin_2 empty for a single car.
select:
  - platform: template
    name: "Active Car"
    id: active_car
    options: ["Car 1", "Car 2"]
    initial_option: "Car 1"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          const bool second = x == "Car 2";
          const std::string vin = second ? "${tesla_vin_2}" : "${tesla_vin}";
          if (vin.size() != 17) { ESP_LOGW("car", "%s has no VIN configured", x.c_str()); return; }
          const uint64_t addr = second ? id(mac_car2) : id(mac_car1);
          ESP_LOGI("car", "Active car: %s (%s)", x.c_str(), addr ? discover::mac_str(addr).c_str() : "searching");
          id(tesla_ble_vehicle_id)->set_vin(vin.c_str());
          // Unknown MAC: the advertisement lambda above sets it as soon as the car is heard.
          if (addr) id(ble_tesla_id)->set_address(addr);
          id(ble_tesla_id)->disconnect();

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret wifi_hotspot_password

# Native API kept for Home Assistant later. No HA yet, so don't reboot when no client connects.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# REST + Server-Sent Events for Solar Surplus EV. Auth so other LAN devices can't change charging.
web_server:
  port: 80
  version: 3
  auth:
    type: basic  # LAN only; Solar Surplus EV sends it on each request
    username: !secret web_username
    password: !secret web_password
